[package]
name = "minecraft-server-downloader"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Minecraft Server Downloader"
license = "MIT"

[lib]
name = "minecraft_server_downloader"
path = "src/lib.rs"

[[bin]]
name = "MinecraftServerDownloader"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
regex = "1"
ico = "0.3"
rfd = "0.15"
tao = "0.30"
wry = "0.47"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
